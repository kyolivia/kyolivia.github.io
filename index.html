@keyframes petHopB{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.08,.9)}50%{transform:translateY(-22px) scale(.95,1.06)}82%{transform:translateY(0) scale(1.07,.93)}}

.deskgray{background:radial-gradient(ellipse 80% 75% at 50% 50%, rgba(28,20,15,0) 50%, rgba(28,20,15,.18) 100%),linear-gradient(rgba(206,200,194,.34),rgba(206,200,194,.34)),url(assets/textures/desk-wood-gray.jpg) center/cover no-repeat,#5E544C}

@media (max-width:820px){.stainwrap{display:none}.cover{display:flex !important;flex-direction:column;gap:22px}.cover>*{transform:none !important;margin:0 !important}.cv-photo{height:420px}.cv-sticky{align-self:flex-start;width:auto;margin:0 !important}.cv-pet{bottom:auto;top:316px;left:calc(var(--fx) * 100% - 34px)}.chad{--fall:calc((1 - var(--fy)) * 420px - 34px)}}

<div style="position: relative; z-index: 2; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 28px; min-height: 700px">


${(s0) ? html`

<span style="position: absolute; inset: 0; border-radius: 50%; background: #CFC5B7; box-shadow: inset 0 2px 3px rgba(0,0,0,0.35); animation: punchIn 0.18s ease-out both"></span>
<span style="position: absolute; inset: 0; border-radius: 50%; background: ${h.chad}; animation: chadFall 0.8s ease-in forwards"></span>
</span>

<div class="cv-pet" style="--fx: ${petX}">
<button type="button" class="pet-btn" onClick="${petTap}" aria-label="${petLabel}"><img class="pet-img" src="${petSrc}" alt="" style="animation: ${petAnim}" /></button>
${(petAsleep) ? html`<span class="pet-z" aria-hidden="true">z</span><span class="pet-z b" aria-hidden="true">z</span>` : null}
</div>
<img class="cv-note" src="assets/handwriting/go-on-punch-a-hole.png" alt="go on, punch a hole" style="grid-column: 2 / 6; grid-row: 1; align-self: start; justify-self: start; margin: 26px 0 0 0; height: 24px; width: auto; z-index: 4; pointer-events: none; transform: rotate(-3deg)" />

<h1 class="cv-name" style="margin: 0; grid-column: 5 / 12; grid-row: 1 / 3; align-self: center; justify-self: start; z-index: 3"><img src="${nameImg}" alt="Olivia Tran" style="display: block; width: 100%; max-width: ${nameMax}px; height: auto; transform: rotate(-1.5deg)" /></h1>

<div class="pgR cv-paper" style="grid-column: 6 / 12; grid-row: 3 / 7; z-index: 2; padding: 34px 40px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 18px; transform: rotate(0.8deg)">
<p style="margin: 0; font-size: 17px; line-height: 1.6; max-width: 460px">Hey! I’m a second-year at Brown studying computer science. I’m interested in natural language processing and neural networks. I was at Amazon Web Services (AWS) last summer, and right now I’m building a digital calling card with a friend!</p>
<a href="resume.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; font-size: 15px; color: ${c.ink}; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px">or read the one-page résumé</a>
</div>

<div class="cv-label" style="position: relative; grid-column: 3 / 7; grid-row: 7 / 9; align-self: center; justify-self: end; z-index: 4; background: #FBF9F3; padding: 18px 24px 20px; display: flex; flex-direction: column; gap: 6px; transform: rotate(-3deg); box-shadow: 1px 2px 2px rgba(40,30,20,0.16), 5px 9px 16px -6px rgba(40,30,20,0.22)">

<img src="assets/handwriting/this-journal-belongs-to.png" alt="this journal belongs to" style="display: block; height: 20px; width: auto; align-self: flex-start; flex: none" />
<img src="assets/handwriting/olivia-tran-label.png" alt="Olivia Tran" style="display: block; height: 30px; width: auto; align-self: flex-start; flex: none; margin-top: 4px" />
</div>

<div class="cv-sticky" style="position: relative; grid-column: 10 / 13; grid-row: 2 / 5; align-self: start; justify-self: end; margin: 30px -90px 0 0; z-index: 5; width: 200px; box-sizing: border-box; padding: 18px 18px 22px; background: #DCE0CB; transform: rotate(4deg); box-shadow: 0 1px 1px rgba(50,55,40,0.12), 0 12px 14px -10px rgba(50,55,40,0.32); display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.45; color: #1A1A18">
<span style="font-weight: 600; color: #8C2A4A">currently:</span>
<span>creating a card project</span>
<span>practicing a new koto piece</span>
<span>learning how to make kokedamas</span>
</div>

<div class="cv-find" style="grid-column: 8 / 12; grid-row: 7 / 9; align-self: center; z-index: 3; display: flex; flex-direction: column; gap: 6px; padding-left: 10px">
<img src="assets/handwriting/find-me.png" alt="find me!" style="display: block; height: 30px; width: auto; align-self: flex-start; flex: none; transform: rotate(-2deg)" />
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px">
${(contactRows || []).map((t) => html`

`)}

${(s1) ? html`
<div class="pgL" style="position: relative; z-index: 3; padding: 44px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px; border-radius: 2px">
<div class="pet-side">
<button type="button" class="pet-btn" onClick="${petTap}" aria-label="${petLabel}"><img class="pet-img" src="${petSrc}" alt="" style="animation: ${petAnim}" /></button>
${(petAsleep) ? html`<span class="pet-z" aria-hidden="true">z</span><span class="pet-z b" aria-hidden="true">z</span>` : null}
</div>
<div style="position: relative; z-index: 3; align-self: center; width: 100%; max-width: 330px; margin: auto 0; transform: rotate(-2.5deg)">

<img src="assets/handwriting/hi-its-me.png" alt="hi, it’s me!" style="display: block; height: 24px; width: auto; max-width: 100%; object-fit: contain; object-position: left center; max-width: 100%; object-fit: contain; margin: 12px auto 0;; align-self: flex-start; flex: none" />
<div aria-hidden="true" class="tape" style="position: absolute; top: -12px; left: 36%; width: 90px; height: 24px; background: linear-gradient(90deg, rgba(214,198,158,.72), rgba(230,218,184,.88) 40%, rgba(214,198,158,.72)); transform: rotate(-4deg)"></div></div>
</div>

<p style="margin: 0; font-size: 16px; line-height: 1.65">I grew up in a small town in the Hudson Valley, New York. I started out making Roblox games in elementary school, then Unity games in middle school, then websites for local businesses in high school. Now I study computer science at Brown!</p>
<p style="margin: 0; font-size: 16px; line-height: 1.65">At Brown, I’m building a digital calling card with a friend: tap phones to exchange, and the back of the card shows what the two of you have in common. I also help teach students how to code with The Artemis Program.</p>
<span style="font-size: 14px; font-weight: 600; color: #8C2A4A; margin-bottom: -8px">my hobbies:</span>

</button>
<span aria-hidden="true" class="tape" style="position: absolute; top: -8px; left: 50%; margin-left: -26px; width: 52px; height: 18px; background: linear-gradient(90deg, rgba(214,198,158,.72), rgba(230,218,184,.88) 40%, rgba(214,198,158,.72)); pointer-events: none; transform: rotate(${ph.tapeTilt}deg)"></span></div>

${(s2) ? html`

prevOpacity: s === 0 ? 0.35 : 1, nextOpacity: s === last ? 0.35 : 1,
pageLabel: sections[shown].label + ' · ' + sections[shown].pages
};
}
}
render(html`<${Component} ...${{"palette": "original", "pencil": true, "nameStyle": "bubble", "nameColor": "burgundy", "desk": "walnut"}} />`, document.getElementById('app'));
})();
</script>
